<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartvisning og Eksport</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 10px 15px;
            background-color: #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1000;
        }
        button {
            padding: 8px 12px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #005999;
        }
        #map-container {
            position: relative;
            flex: 1;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #peaksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 450;
        }
        .draggable-element {
            position: absolute;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            z-index: 500;
            cursor: move;
            user-select: none;
        }
        .draggable-element.no-frame {
            background: transparent;
            border: none;
        }
        .draggable-title {
            font-size: 16px;
            font-weight: bold;
        }
        .draggable-label {
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="generateAndDownloadImage(2)">Eksporter Kart (2x HD)</button>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <canvas id="peaksCanvas"></canvas>
        
        <!-- Eksempel på et draggbart element (tittel/info) -->
        <div class="draggable-element draggable-title" style="top: 20px; left: 20px;">
            <span class="draggable-label">Karttittel</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Global variabel-deklarasjon
        const mapDiv = document.getElementById('map');
        const peaksCanvas = document.getElementById('peaksCanvas');
        
        let waterLayerEnabled = true;
        let pathsLayerEnabled = true;
        let waterGeoJsonLayer = null;
        let pathsGeoJsonLayer = null;
        let gpxAnalysis = { pts: [] };

        // 1. Initialiser Leaflet-kart
        const map = L.map('map').setView([69.6492, 18.9553], 12); // Tromsø som standard

        // Bakgrunnskart (CARTO Dark)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19,
            crossOrigin: true
        }).addTo(map);

        // Hillshade/Terreng-lag (Eksempel)
        const hillshadeTileLayer = L.tileLayer('https://tiles.wmflabs.org/hillshading/{z}/{x}/{y}.png', {
            opacity: 0.3,
            crossOrigin: true
        }).addTo(map);

        // Tilpass canvas til kartstørrelse ved endring
        function resizeCanvas() {
            const rect = mapDiv.getBoundingClientRect();
            peaksCanvas.width = rect.width;
            peaksCanvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawDirectionArrowsOnCanvas(ctx) {
            // Hjelpefunksjon for å tegne piler dersom definert
        }

        function drawProfileOnCanvas(ctx, w, h, scale, noFrame) {
            // Hjelpefunksjon for høydeprofil
        }

        // 2. Eksportfunksjon
        async function generateAndDownloadImage(scale) {
            const mapRect = mapDiv.getBoundingClientRect();
            const exportW = Math.round(mapRect.width);
            const exportH = Math.round(mapRect.height);

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = Math.round(exportW * scale);
            exportCanvas.height = Math.round(exportH * scale);
            const ctx = exportCanvas.getContext('2d');

            ctx.scale(scale, scale);
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, exportW, exportH);

            // A. Tegn alle kartfliser (både CARTO-bakgrunn og Hillshade/terreng)
            const tiles = document.querySelectorAll('.leaflet-tile-container img');
            for (const tile of tiles) {
                const tileRect = tile.getBoundingClientRect();
                const x = tileRect.left - mapRect.left;
                const y = tileRect.top - mapRect.top;

                try {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    await new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = resolve;
                        img.src = tile.src;
                    });

                    if (img.complete && img.naturalWidth !== 0) {
                        const container = tile.closest('.leaflet-layer');
                        const opacity = container ? parseFloat(window.getComputedStyle(container).opacity) : 1;
                        
                        ctx.globalAlpha = opacity;
                        ctx.drawImage(img, x, y, tileRect.width, tileRect.height);
                        ctx.globalAlpha = 1.0;
                    }
                } catch (e) {
                    console.warn('Kunne ikke tegne kartflis', e);
                }
            }

            // B. Tegn Vann/Elver (GeoJSON) hvis aktivert
            if (typeof waterLayerEnabled !== 'undefined' && waterLayerEnabled && typeof waterGeoJsonLayer !== 'undefined' && waterGeoJsonLayer) {
                waterGeoJsonLayer.eachLayer(layer => {
                    if (layer instanceof L.Polyline || layer instanceof L.Polygon) {
                        const latLngs = layer.getLatLngs();
                        const isPolygon = layer instanceof L.Polygon;
                        const flatParts = Array.isArray(latLngs[0]) ? latLngs : [latLngs];
                        
                        flatParts.forEach(ring => {
                            ctx.beginPath();
                            const points = Array.isArray(ring) ? ring : [ring];
                            points.forEach((ll, i) => {
                                const pt = map.latLngToContainerPoint(ll);
                                if (i === 0) ctx.moveTo(pt.x, pt.y);
                                else ctx.lineTo(pt.x, pt.y);
                            });
                            
                            if (isPolygon) {
                                ctx.closePath();
                                ctx.fillStyle = 'rgba(51, 136, 255, 0.25)';
                                ctx.fill();
                            }
                            
                            ctx.strokeStyle = '#4a90e2';
                            ctx.lineWidth = isPolygon ? 0.8 : 1.5;
                            ctx.globalAlpha = 0.7;
                            ctx.stroke();
                            ctx.globalAlpha = 1.0;
                        });
                    }
                });
            }

            // C. Tegn Stier (GeoJSON) hvis aktivert
            if (typeof pathsLayerEnabled !== 'undefined' && pathsLayerEnabled && typeof pathsGeoJsonLayer !== 'undefined' && pathsGeoJsonLayer) {
                pathsGeoJsonLayer.eachLayer(layer => {
                    if (layer instanceof L.Polyline) {
                        const latLngs = layer.getLatLngs();
                        const flatParts = Array.isArray(latLngs[0]) ? latLngs : [latLngs];

                        flatParts.forEach(ring => {
                            ctx.beginPath();
                            ctx.setLineDash([3 * scale, 4 * scale]);
                            const points = Array.isArray(ring) ? ring : [ring];
                            points.forEach((ll, i) => {
                                const pt = map.latLngToContainerPoint(ll);
                                if (i === 0) ctx.moveTo(pt.x, pt.y);
                                else ctx.lineTo(pt.x, pt.y);
                            });

                            ctx.strokeStyle = '#e67e22';
                            ctx.lineWidth = 1.2;
                            ctx.globalAlpha = 0.7;
                            ctx.stroke();
                            ctx.setLineDash([]);
                            ctx.globalAlpha = 1.0;
                        });
                    }
                });
            }

            // D. Tegn GPX-sporet
            if (gpxAnalysis?.pts?.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                gpxAnalysis.pts.forEach((p, i) => {
                    const pt = map.latLngToContainerPoint([p.lat, p.lng]);
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });

                ctx.stroke();
            }

            // E. Tegn overliggende topp-linjer og retningspiler
            if (typeof peaksCanvas !== 'undefined') {
                ctx.drawImage(peaksCanvas, 0, 0, exportW, exportH);
            }
            if (typeof drawDirectionArrowsOnCanvas === 'function') {
                drawDirectionArrowsOnCanvas(ctx);
            }

            // F. Tegn UI-elementer (Overskrifter, paneler)
            document.querySelectorAll('.draggable-element').forEach(el => {
                const rect = el.getBoundingClientRect();
                const x = rect.left - mapRect.left;
                const y = rect.top - mapRect.top;

                if (x + rect.width <= 0 || x >= exportW ||
                    y + rect.height <= 0 || y >= exportH) return;

                const hasFrame = !el.classList.contains('no-frame');

                if (hasFrame) {
                    ctx.fillStyle = 'rgba(15,15,15,0.85)';
                    ctx.fillRect(x, y, rect.width, rect.height);
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, rect.width, rect.height);
                }

                const isProfile = el.classList.contains('profile-element');

                if (isProfile && typeof drawProfileOnCanvas === 'function') {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = 240 * scale;
                    tempCanvas.height = 80 * scale;

                    drawProfileOnCanvas(
                        tempCanvas.getContext('2d'),
                        tempCanvas.width,
                        tempCanvas.height,
                        scale,
                        !hasFrame
                    );

                    ctx.drawImage(tempCanvas, x + 8, y + 22, 240, 80);
                }

                const label = el.querySelector('.draggable-label');
                if (label) {
                    ctx.fillStyle = '#ffffff';

                    const isTitle = el.classList.contains('draggable-title');
                    ctx.font = isTitle ? 'bold 16px sans-serif' : 'bold 11px sans-serif';

                    if (!hasFrame) {
                        ctx.shadowColor = 'black';
                        ctx.shadowBlur = 4;
                    }

                    ctx.fillText(
                        label.textContent,
                        x + 8,
                        y + (isTitle ? 18 : 13)
                    );

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                }
            });

            // G. Last ned bildet
            const link = document.createElement('a');
            link.download = `kart-${exportW}x${exportH}-${scale}x.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
