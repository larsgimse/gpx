<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPX Visning - Enkel Oversikt med Fjelltopper og Bildeeksport</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        /* Sentrert overskrift */
        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            pointer-events: none;
        }
        
        .nav-buttons { display: flex; gap: 8px; align-items: center; z-index: 1001; }
        
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn:hover {
            background: #333;
            border-color: #555;
        }

        /* Opplastningsknapp i grå stil */
        .btn-upload {
            background: #3a3a3a;
            border-color: #555;
            color: #fff;
            font-weight: 500;
        }

        .btn-upload:hover {
            background: #4a4a4a;
            border-color: #666;
        }

        .btn-toggle {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-toggle.active {
            background: #444;
            border-color: #888;
            color: #fff;
        }

        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        .btn-download {
            background: #2a2a2a;
            border-color: #444;
            color: #fff;
        }

        .select-style {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        #file-input {
            display: none;
        }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        /* Lag for flyttbare fjelltopper */
        #peaks-canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 450;
        }

        #labels-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        .draggable-element {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .draggable-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            color: #00d2ff;
            text-transform: uppercase;
        }

        .delete-btn {
            display: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #ff5555;
            line-height: 1;
            padding: 0 2px;
        }

        .draggable-element:hover .delete-btn {
            display: inline-block;
        }

        /* Stiplet linje for områdemarkering */
        #crop-box {
            position: absolute;
            border: 1.5px dashed #ffffff;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 900;
            display: none;
        }

        /* Informasjonsboks for områdemarkering */
        #info-banner {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 1000;
            display: none;
            border: 1px solid #555;
            pointer-events: none;
        }

        /* Modal for valging av bildekvalitet */
        #export-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 280px;
        }

        .modal-content h3 { font-size: 1rem; color: #fff; }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 10px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            }
            h1 { 
                position: relative;
                left: auto;
                transform: none;
                font-size: 0.95rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            .btn, .select-style {
                flex: 1;
                text-align: center;
            }
            .leaflet-bottom { bottom: 100px !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-buttons">
            <button id="btn-upload-trigger" class="btn btn-upload">📁 Last opp GPX</button>
            <button id="btn-toggle-peaks" class="btn btn-toggle">⛰️ Fjelltopper</button>
            <select id="line-style" class="select-style">
                <option value="corner">Rett vinkel</option>
                <option value="arc">Tilpasset bue</option>
            </select>
        </div>

        <h1>Oversiktskart</h1>

        <div class="nav-buttons">
            <button id="btn-download-image" class="btn btn-download">📷 Last ned bilde</button>
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
        </div>
    </header>

    <input type="file" id="file-input" accept=".gpx" multiple />

    <div id="info-banner">Marker området du vil ta bilde av (klikk og dra)</div>

    <div id="map-container">
        <div id="map"></div>
        <canvas id="peaks-canvas-layer"></canvas>
        <div id="labels-layer"></div>
        <div id="crop-box"></div>
    </div>

    <!-- Modal for valg av kvalitet -->
    <div id="export-modal">
        <div class="modal-content">
            <h3>Velg bildekvalitet</h3>
            <select id="export-quality" class="select-style">
                <option value="1">Standard (1x)</option>
                <option value="2" selected>HD (2x)</option>
                <option value="3">Full HD (3x)</option>
                <option value="4">4K / Utskrift (4x)</option>
            </select>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 5px;">
                <button id="modal-cancel" class="btn btn-reset">Avbryt</button>
                <button id="modal-confirm" class="btn btn-upload">Lagre bilde</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const START_LAT = 69.65;
        const START_LON = 18.95;
        const START_ZOOM = 9;

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([START_LAT, START_LON], START_ZOOM);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        // CARTO Basemap Dark
        const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2o3a_1_671194bbedbad28841272141', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20,
            crossOrigin: true
        }).addTo(map);

        const loadedTracks = [];

        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('btn-upload-trigger');
        const resetBtn = document.getElementById('btn-reset');
        const peaksBtn = document.getElementById('btn-toggle-peaks');
        const lineStyleSelect = document.getElementById('line-style');
        const downloadImageBtn = document.getElementById('btn-download-image');
        const infoBanner = document.getElementById('info-banner');
        const cropBox = document.getElementById('crop-box');
        const exportModal = document.getElementById('export-modal');
        const modalConfirm = document.getElementById('modal-confirm');
        const modalCancel = document.getElementById('modal-cancel');

        const peaksCanvas = document.getElementById('peaks-canvas-layer');
        const peaksCtx = peaksCanvas.getContext('2d');
        const labelsLayer = document.getElementById('labels-layer');

        let peaksEnabled = false;
        let detectedPeaks = [];
        let isFetchingPeaks = false;

        // Tilpass canvas-størrelse til vinduet
        function resizeCanvas() {
            peaksCanvas.width = window.innerWidth;
            peaksCanvas.height = window.innerHeight;
            redrawPeakLines();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    lesOgLeggTilGpx(evt.target.result, file.name);
                };
                reader.readAsText(file);
            });

            fileInput.value = '';
        });

        function lesOgLeggTilGpx(gpxData, fileTitle) {
            const track = new L.GPX(gpxData, {
                async: true,
                polyline_options: {
                    color: '#ffffff',
                    opacity: 0.6,
                    weight: 2.5,
                    lineCap: 'round'
                },
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
            });

            track.on('loaded', function(e) {
                const layer = e.target;
                const trackBounds = layer.getBounds();

                if (!trackBounds.isValid()) return;

                loadedTracks.push(layer);

                const trackName = layer.get_name() || fileTitle.replace('.gpx', '');

                if (!isTouchDevice) {
                    layer.bindTooltip(`<b>${trackName}</b>`, {
                        sticky: true,
                        direction: 'top',
                        offset: [0, -10]
                    });

                    layer.on('mouseover', function() {
                        layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                        layer.bringToFront();
                    });

                    layer.on('mouseout', function() {
                        layer.setStyle({ color: '#ffffff', weight: 2.5, opacity: 0.6 });
                    });
                }

                layer.on('click', function() {
                    layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                    map.fitBounds(trackBounds, { padding: [100, 100] });
                });

                const center = trackBounds.getCenter();
                const distFraStart = map.distance(center, L.latLng(START_LAT, START_LON));

                if (distFraStart > 80000) {
                    map.setView(center, 7);
                }

                if (peaksEnabled) {
                    fetchPeaksForCurrentView();
                }
            });

            track.addTo(map);
        }

        // --- FJELLTOPP-FUNKSJONALITET (Hentet kode fra index-9.html) ---

        peaksBtn.addEventListener('click', () => {
            peaksEnabled = !peaksEnabled;
            peaksBtn.classList.toggle('active', peaksEnabled);
            if (peaksEnabled) {
                fetchPeaksForCurrentView();
            } else {
                clearPeaks();
            }
        });

        map.on('moveend zoomend', () => {
            if (peaksEnabled) {
                fetchPeaksForCurrentView();
            } else {
                updatePeakPositions();
            }
        });

        map.on('move zoom', () => {
            updatePeakPositions();
        });

        lineStyleSelect.addEventListener('change', () => redrawPeakLines());

        function clearPeaks() {
            detectedPeaks.forEach(p => p.element.remove());
            detectedPeaks = [];
            peaksCtx.clearRect(0, 0, peaksCanvas.width, peaksCanvas.height);
        }

        async function fetchPeaksForCurrentView() {
            if (isFetchingPeaks) return;
            isFetchingPeaks = true;

            const bounds = map.getBounds();
            const minLat = bounds.getSouth();
            const maxLat = bounds.getNorth();
            const minLon = bounds.getWest();
            const maxLon = bounds.getEast();

            let peaks = [];

            try {
                const url = `https://ws.geonorge.no/stedsnavn/v1/punkt?nordmin=${minLat}&nordmaks=${maxLat}&ostmin=${minLon}&ostmaks=${maxLon}&navneobjekttype=Fjell*&maxAntall=50`;
                const res = await fetch(url);
                if (res.ok) {
                    const json = await res.json();
                    peaks = parseKartverketGeonorge(json);
                }
            } catch (err) {
                console.warn("Kartverket API feilet, prøver Overpass fallback...", err);
            }

            if (peaks.length === 0) {
                try {
                    const overpassQuery = `[out:json];node["natural"="peak"](${minLat},${minLon},${maxLat},${maxLon});out;`;
                    const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
                    if (res.ok) {
                        const json = await res.json();
                        peaks = parseOverpass(json);
                    }
                } catch (err) {
                    console.error("Overpass API feilet:", err);
                }
            }

            renderPeaks(peaks);
            isFetchingPeaks = false;
        }

        function parseKartverketGeonorge(data) {
            if (!data || !data.navn) return [];
            return data.navn.map(item => ({
                name: item.stedsnavn?.[0]?.skrivemåte || item.stedsnavn,
                lat: item.representasjonspunkt?.nord,
                lon: item.representasjonspunkt?.øst,
                elevation: item.meterOverHavet || item.stedsnavn?.[0]?.meterOverHavet
            })).filter(p => p.name && p.lat && p.lon);
        }

        function parseOverpass(data) {
            if (!data || !data.elements) return [];
            return data.elements.map(el => ({
                name: el.tags?.name || "Ukjent topp",
                lat: el.lat,
                lon: el.lon,
                elevation: el.tags?.ele ? parseInt(el.tags.ele) : null
            }));
        }

        function renderPeaks(apiPeaks) {
            clearPeaks();
            const addedNames = new Set();

            apiPeaks.forEach(peak => {
                if (addedNames.has(peak.name)) return;
                addedNames.add(peak.name);
                createPeakAnnotation(peak);
            });

            redrawPeakLines();
        }

        function createPeakAnnotation(peak) {
            const labelContainer = document.createElement('div');
            labelContainer.className = 'draggable-element';
            
            const heightText = peak.elevation ? ` ${peak.elevation}m` : '';
            labelContainer.innerHTML = `
                <span class="draggable-label">${peak.name.toUpperCase()}${heightText}</span>
                <span class="delete-btn" title="Fjern">×</span>
            `;

            let relX = 25;
            let relY = -20;

            labelsLayer.appendChild(labelContainer);

            const peakData = {
                id: Date.now() + Math.random(),
                lat: peak.lat,
                lon: peak.lon,
                relX: relX,
                relY: relY,
                element: labelContainer
            };

            const pt = map.latLngToContainerPoint([peak.lat, peak.lon]);
            labelContainer.style.left = `${pt.x + relX}px`;
            labelContainer.style.top = `${pt.y + relY}px`;

            labelContainer.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                labelContainer.remove();
                detectedPeaks = detectedPeaks.filter(p => p.id !== peakData.id);
                redrawPeakLines();
            });

            detectedPeaks.push(peakData);
            makePeakDraggable(labelContainer, peakData);
        }

        function updatePeakPositions() {
            detectedPeaks.forEach(p => {
                const pt = map.latLngToContainerPoint([p.lat, p.lon]);
                p.element.style.left = `${pt.x + p.relX}px`;
                p.element.style.top = `${pt.y + p.relY}px`;
            });
            redrawPeakLines();
        }

        function makePeakDraggable(element, data) {
            let isDragging = false;
            let startMouseX = 0, startMouseY = 0;
            let startRelX = 0, startRelY = 0;

            element.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('delete-btn')) return;
                isDragging = true;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                startRelX = data.relX;
                startRelY = data.relY;
                e.stopPropagation();
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                data.relX = startRelX + (e.clientX - startMouseX);
                data.relY = startRelY + (e.clientY - startMouseY);
                updatePeakPositions();
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
        }

        function redrawPeakLines() {
            peaksCtx.clearRect(0, 0, peaksCanvas.width, peaksCanvas.height);
            if (detectedPeaks.length === 0) return;

            const style = lineStyleSelect.value;
            const lineColor = "#00d2ff";

            detectedPeaks.forEach(p => {
                const anchor = map.latLngToContainerPoint([p.lat, p.lon]);

                peaksCtx.beginPath();
                peaksCtx.arc(anchor.x, anchor.y, 3.5, 0, Math.PI * 2);
                peaksCtx.fillStyle = lineColor;
                peaksCtx.fill();

                const labelHeight = p.element.offsetHeight || 15;
                const targetX = anchor.x + p.relX;
                const targetY = anchor.y + p.relY + (labelHeight / 2);

                peaksCtx.beginPath();
                peaksCtx.setLineDash([3, 3]);
                peaksCtx.strokeStyle = lineColor;
                peaksCtx.lineWidth = 1.2;

                if (style === 'arc') {
                    const cpX = anchor.x + p.relX * 0.8;
                    const cpY = anchor.y;
                    peaksCtx.moveTo(anchor.x, anchor.y);
                    peaksCtx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                } else {
                    peaksCtx.moveTo(anchor.x, anchor.y);
                    peaksCtx.lineTo(targetX, anchor.y);
                    peaksCtx.lineTo(targetX, targetY);
                }

                peaksCtx.stroke();
                peaksCtx.setLineDash([]);
            });
        }

        // --- HELT NY FUNKSJONALITET: OMRAADEMARKERING OG BILDEEKSPORT ---

        let isSelectionMode = false;
        let isSelecting = false;
        let selectionStart = { x: 0, y: 0 };
        let selectionEnd = { x: 0, y: 0 };

        downloadImageBtn.addEventListener('click', () => {
            isSelectionMode = true;
            infoBanner.style.display = 'block';
            map.dragging.disable();
            map.getContainer().style.cursor = 'crosshair';
        });

        const mapDiv = document.getElementById('map-container');

        mapDiv.addEventListener('mousedown', (e) => {
            if (!isSelectionMode) return;
            if (e.target.closest('header') || e.target.closest('.draggable-element') || e.target.closest('#export-modal')) return;

            isSelecting = true;
            const rect = mapDiv.getBoundingClientRect();
            selectionStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            selectionEnd = { ...selectionStart };

            cropBox.style.left = `${selectionStart.x}px`;
            cropBox.style.top = `${selectionStart.y}px`;
            cropBox.style.width = '0px';
            cropBox.style.height = '0px';
            cropBox.style.display = 'block';
        });

        mapDiv.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;
            const rect = mapDiv.getBoundingClientRect();
            selectionEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            const x = Math.min(selectionStart.x, selectionEnd.x);
            const y = Math.min(selectionStart.y, selectionEnd.y);
            const w = Math.abs(selectionStart.x - selectionEnd.x);
            const h = Math.abs(selectionStart.y - selectionEnd.y);

            cropBox.style.left = `${x}px`;
            cropBox.style.top = `${y}px`;
            cropBox.style.width = `${w}px`;
            cropBox.style.height = `${h}px`;
        });

        mapDiv.addEventListener('mouseup', () => {
            if (!isSelecting) return;
            isSelecting = false;
            isSelectionMode = false;
            infoBanner.style.display = 'none';
            map.dragging.enable();
            map.getContainer().style.cursor = '';

            const w = Math.abs(selectionStart.x - selectionEnd.x);
            const h = Math.abs(selectionStart.y - selectionEnd.y);

            if (w < 20 || h < 20) {
                cropBox.style.display = 'none';
                alert('For lite område valgt. Marker på nytt.');
                return;
            }

            // Åpne modal for kvalitet
            exportModal.style.display = 'flex';
        });

        modalCancel.addEventListener('click', () => {
            exportModal.style.display = 'none';
            cropBox.style.display = 'none';
        });

        modalConfirm.addEventListener('click', () => {
            exportModal.style.display = 'none';
            const scale = parseFloat(document.getElementById('export-quality').value);
            generateAndDownloadImage(scale);
            cropBox.style.display = 'none';
        });

        async function generateAndDownloadImage(scale) {
            const cropX = Math.min(selectionStart.x, selectionEnd.x);
            const cropY = Math.min(selectionStart.y, selectionEnd.y);
            const cropW = Math.abs(selectionStart.x - selectionEnd.x);
            const cropH = Math.abs(selectionStart.y - selectionEnd.y);

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = cropW * scale;
            exportCanvas.height = cropH * scale;
            const ctx = exportCanvas.getContext('2d');

            ctx.scale(scale, scale);

            // 1. Tegn bakgrunnsfarge
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, cropW, cropH);

            // 2. Tegn Leaflet kartfliser (CARTO)
            const tiles = document.querySelectorAll('.leaflet-tile-container img');
            const mapRect = mapDiv.getBoundingClientRect();

            for (let tile of tiles) {
                const tileRect = tile.getBoundingClientRect();
                const x = tileRect.left - mapRect.left - cropX;
                const y = tileRect.top - mapRect.top - cropY;

                try {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    await new Promise((resolve) => {
                        img.onload = resolve;
                        img.onerror = resolve;
                        img.src = tile.src;
                    });
                    if (img.complete && img.naturalWidth !== 0) {
                        ctx.drawImage(img, x, y, tileRect.width, tileRect.height);
                    }
                } catch (e) {
                    console.warn("Kunne ikke tegne kartflis", e);
                }
            }

            // 3. Tegn GPX-sporene (Polyline vector-lag)
            const svgLayer = document.querySelector('.leaflet-overlay-pane svg');
            if (svgLayer) {
                const svgRect = svgLayer.getBoundingClientRect();
                const svgX = svgRect.left - mapRect.left - cropX;
                const svgY = svgRect.top - mapRect.top - cropY;

                const svgString = new XMLSerializer().serializeToString(svgLayer);
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const svgImg = new Image();
                await new Promise((resolve) => {
                    svgImg.onload = resolve;
                    svgImg.onerror = resolve;
                    svgImg.src = url;
                });
                ctx.drawImage(svgImg, svgX, svgY, svgRect.width, svgRect.height);
                URL.revokeObjectURL(url);
            }

            // 4. Tegn Fjelltopper (linjer og punkter)
            ctx.drawImage(peaksCanvas, -cropX, -cropY);

            // 5. Tegn Fjelltopp-tekster (DOM-elementer)
            detectedPeaks.forEach(p => {
                const rect = p.element.getBoundingClientRect();
                const x = rect.left - mapRect.left - cropX;
                const y = rect.top - mapRect.top - cropY;

                if (x + rect.width > 0 && x < cropW && y + rect.height > 0 && y < cropH) {
                    const text = p.element.querySelector('.draggable-label').textContent;
                    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, sans-serif';
                    
                    // Bakgrunn for tekst
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.fillRect(x, y, rect.width, rect.height);

                    // Tekst
                    ctx.fillStyle = '#00d2ff';
                    ctx.fillText(text, x + 6, y + 13);
                }
            });

            // Last ned fil
            const link = document.createElement('a');
            link.download = `kart-utsnitt-${Math.round(cropW * scale)}x${Math.round(cropH * scale)}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        // Nullstill-knapp
        resetBtn.addEventListener('click', function() {
            loadedTracks.forEach(layer => map.removeLayer(layer));
            loadedTracks.length = 0;
            clearPeaks();
            peaksEnabled = false;
            peaksBtn.classList.remove('active');
            map.setView([START_LAT, START_LON], START_ZOOM);
        });
    </script>
</body>
</html>
