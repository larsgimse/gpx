<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPX Visning - Enkel Oversikt</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-color: #eeeeee;
            --highlight-orange: #fc4c02;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: var(--panel-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            min-height: 52px;
        }

        h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }
        
        .nav-buttons { display: flex; gap: 8px; align-items: center; }
        
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn:hover {
            background: #333;
            border-color: #555;
        }

        .btn-upload {
            background: var(--highlight-orange);
            border-color: #e04300;
            font-weight: 600;
        }

        .btn-upload:hover {
            background: #e04300;
        }

        .btn-reset {
            background: #222;
            border-color: #444;
            color: #ccc;
        }

        #file-input {
            display: none;
        }

        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a1a !important;
            color: #fff !important;
            border: 1px solid var(--highlight-orange);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: #1a1a1a !important;
        }

        @media (max-width: 600px) {
            header {
                top: auto;
                bottom: 20px;
                flex-direction: column;
                gap: 10px;
                align-items: center;
                background: rgba(20, 20, 20, 0.95);
                box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            }
            h1 { 
                font-size: 0.95rem; 
                text-align: center;
            }
            .nav-buttons {
                width: 100%;
                justify-content: center;
            }
            .btn {
                flex: 1;
                text-align: center;
            }
            .leaflet-bottom { bottom: 100px !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Oversiktskart</h1>
        <div class="nav-buttons">
            <button id="btn-upload-trigger" class="btn btn-upload">📁 Last opp GPX</button>
            <button id="btn-reset" class="btn btn-reset">🔄 Nullstill</button>
        </div>
    </header>

    <input type="file" id="file-input" accept=".gpx" multiple />

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const minRenderer = L.canvas({ tolerance: isTouchDevice ? 22 : 3 });

        const START_LAT = 69.65;
        const START_LON = 18.95;
        const START_ZOOM = 9;

        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 18,
            renderer: minRenderer
        }).setView([START_LAT, START_LON], START_ZOOM);

        if (isTouchDevice) {
            map.zoomControl.setPosition('topleft');
        }

        // CARTO Basemap Dark
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2o3a_1_671194bbedbad28841272141', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const loadedTracks = [];

        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('btn-upload-trigger');
        const resetBtn = document.getElementById('btn-reset');

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    lesOgLeggTilGpx(evt.target.result, file.name);
                };
                reader.readAsText(file);
            });

            // Nullstill input slik at samme fil kan velges på nytt om ønskelig
            fileInput.value = '';
        });

        function lesOgLeggTilGpx(gpxData, fileTitle) {
            const track = new L.GPX(gpxData, {
                async: true,
                polyline_options: {
                    color: '#ffffff',
                    opacity: 0.6,
                    weight: 2.5,
                    lineCap: 'round'
                },
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null }
            });

            track.on('loaded', function(e) {
                const layer = e.target;
                const trackBounds = layer.getBounds();

                if (!trackBounds.isValid()) return;

                loadedTracks.push(layer);

                const trackName = layer.get_name() || fileTitle.replace('.gpx', '');

                // Tooltip på hover (desktop)
                if (!isTouchDevice) {
                    layer.bindTooltip(`<b>${trackName}</b>`, {
                        sticky: true,
                        direction: 'top',
                        offset: [0, -10]
                    });

                    layer.on('mouseover', function() {
                        layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                        layer.bringToFront();
                    });

                    layer.on('mouseout', function() {
                        layer.setStyle({ color: '#ffffff', weight: 2.5, opacity: 0.6 });
                    });
                }

                // Klikk for å zoome inn slik at sporet dekker ~80 % av skjermen
                layer.on('click', function() {
                    layer.setStyle({ color: 'var(--highlight-orange)', weight: 4.0, opacity: 1.0 });
                    map.fitBounds(trackBounds, { padding: [100, 100] });
                });

                // Sjekk om sporet er utenfor startutsnittet (nærområdet)
                const center = trackBounds.getCenter();
                const distFraStart = map.distance(center, L.latLng(START_LAT, START_LON));

                // Dersom sporet er mer enn 80 km unna startpunktet, flytt visningen dit med god avstand
                if (distFraStart > 80000) {
                    map.setView(center, 7);
                }
            });

            track.addTo(map);
        }

        // Nullstill-knapp: tilbakestiller kartet til opprinnelig posisjon og fjern opplastede spor
        resetBtn.addEventListener('click', function() {
            loadedTracks.forEach(layer => map.removeLayer(layer));
            loadedTracks.length = 0;
            map.setView([START_LAT, START_LON], START_ZOOM);
        });
    </script>
</body>
</html>
