<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX-spor med NVE Bratthet</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-family: sans-serif;
        }

        .legend {
            background: white;
            padding: 10px 12px;
            line-height: 1.5;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 13px;
        }
        .legend h4 { margin: 0 0 6px 0; font-size: 14px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; }
        .color-box {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="gpx-file"><b>Velg GPX-fil:</b></label><br>
        <input type="file" id="gpx-file" accept=".gpx">
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet GPX plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // 1. Initialiser kartet
        const map = L.map('map').setView([61.5, 8.5], 8);

        // 2. Bakgrunnskart (Kartverket Topo)
        const topoMap = L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.kartverket.no/">Kartverket</a>'
        }).addTo(map);

        // 3. NVE sin aktive Bratthet 2024-tjeneste
        const bratthetMap = L.tileLayer('https://gis3.nve.no/arcgis/rest/services/wmts/Bratthet_2024/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            opacity: 0.6,
            attribution: '&copy; <a href="https://www.nve.no/">NVE</a>'
        }).addTo(map);

        const overlayMaps = {
            "NVE Bratthet": bratthetMap
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);

        // 4. Tegnforklaring (Legend)
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Hellingsvinkel</h4>
                <div class="legend-item"><span class="color-box" style="background: #FFF500;"></span> 27° – 30°</div>
                <div class="legend-item"><span class="color-box" style="background: #FFAA00;"></span> 30° – 35°</div>
                <div class="legend-item"><span class="color-box" style="background: #E60000;"></span> 35° – 40°</div>
                <div class="legend-item"><span class="color-box" style="background: #730000;"></span> 40° – 45°</div>
                <div class="legend-item"><span class="color-box" style="background: #000000;"></span> Over 45°</div>
            `;
            return div;
        };
        legend.addTo(map);

        // 5. Håndter GPX-opplasting
        let currentGpxLayer = null;

        document.getElementById('gpx-file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const gpxData = e.target.result;

                if (currentGpxLayer) {
                    map.removeLayer(currentGpxLayer);
                }

                currentGpxLayer = new L.GPX(gpxData, {
                    async: true,
                    polyline_options: {
                        color: 'blue',
                        opacity: 0.9,
                        weight: 4,
                        lineCap: 'round'
                    }
                }).on('loaded', function (e) {
                    map.fitBounds(e.target.getBounds());
                }).addTo(map);
            };

            reader.readAsText(file);
        });
    </script>
</body>
</html>
