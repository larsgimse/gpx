<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistisk GPX-visning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    body:not(.inverted) {
      background-color: #f0f0f0;
      color: #000;
    }

    .controls {
      margin-bottom: 15px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 850px;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2b2b2b;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      color: #fff;
    }

    body:not(.inverted) .control-group {
      background: #fff;
      border-color: #ccc;
      color: #000;
    }

    button {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    body:not(.inverted) button {
      background: #000;
      color: #fff;
    }

    button:hover {
      background: #ddd;
    }

    body:not(.inverted) button:hover {
      background: #333;
    }

    #status {
      font-weight: 500;
      color: #aaa;
      width: 100%;
      text-align: center;
      margin-top: 4px;
    }

    body:not(.inverted) #status {
      color: #444;
    }

    /* Minimalistisk ramme */
    #frame {
      width: 650px;
      height: 650px;
      background: #ffffff;
      border: 0px solid #000000;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      cursor: grab;
      filter: invert(1) hue-rotate(180deg);
      transition: filter 0.2s ease;
    }

    #frame.grabbing {
      cursor: grabbing;
    }

    #frame:not(.inverted) {
      filter: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Tittel-element */
    #title-container {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
    }

    #title-input {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      border: 1px dashed transparent;
      background: transparent;
      outline: none;
      color: #000;
      font-family: inherit;
    }

    #title-input:hover, #title-input:focus {
      border-color: #ccc;
    }

    /* Interaktive etiketter */
    .label-container {
      position: absolute;
      z-index: 10;
      cursor: move;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      padding: 2px 4px;
    }

    .draggable-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #000000;
      text-transform: uppercase;
    }

    .delete-btn {
      display: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #ff0000;
      line-height: 1;
      padding: 0 2px;
    }

    .label-container:hover .delete-btn,
    #title-container:hover .delete-btn {
      display: inline-block;
    }
  </style>
</head>
<body class="inverted">

  <div class="controls">
    <input type="file" id="gpx-input" accept=".gpx">
    
    <div class="control-group">
      <label><input type="checkbox" id="toggle-map"> Kart</label>
      <input type="range" id="map-opacity" min="0.1" max="1" step="0.05" value="0.35" style="width:50px;" title="Kartintensitet">
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="toggle-border"> Ramme</label>
      <input type="range" id="border-width" min="1" max="10" value="2" style="width:50px;" title="Rammetykkelse">
    </div>

    <div class="control-group">
      <label><input type="checkbox" id="toggle-invert" checked> Inverter</label>
    </div>

    <button id="download-btn">Last ned bilde</button>
    <div id="status">Last opp en GPX-fil</div>
  </div>

  <div id="frame" class="inverted">
    <div id="title-container">
      <input type="text" id="title-input" value="LEGG TIL EGEN TITTEL">
      <span class="delete-btn" id="delete-title" title="Fjern tittel">×</span>
    </div>
    <canvas id="trackCanvas" width="650" height="650"></canvas>
    <div id="labels-layer"></div>
  </div>

  <script>
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');
    const labelsLayer = document.getElementById('labels-layer');
    const statusEl = document.getElementById('status');
    const titleContainer = document.getElementById('title-container');
    const deleteTitleBtn = document.getElementById('delete-title');
    
    const toggleMap = document.getElementById('toggle-map');
    const mapOpacity = document.getElementById('map-opacity');
    const toggleBorder = document.getElementById('toggle-border');
    const borderWidth = document.getElementById('border-width');
    const toggleInvert = document.getElementById('toggle-invert');

    let trackPoints = []; 
    let detectedPeaks = []; 
    let loadedMapTiles = new Map();

    // Panoreringsoffset i piksler
    let offsetX = 0;
    let offsetY = 0;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;

    const CARTO_KEY = "cb1_2o3a_1_671194bbedbad28841272141";

    // Event listeners
    document.getElementById('gpx-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.textContent = "Leser GPX-fil...";

      const reader = new FileReader();
      reader.onload = (event) => {
        parseGPX(event.target.result);
      };
      reader.readAsText(file);
    });

    document.getElementById('download-btn').addEventListener('click', downloadImage);

    deleteTitleBtn.addEventListener('click', () => {
      titleContainer.style.display = 'none';
    });

    toggleBorder.addEventListener('change', updateFrameBorder);
    borderWidth.addEventListener('input', updateFrameBorder);

    function updateFrameBorder() {
      if (toggleBorder.checked) {
        frame.style.border = `${borderWidth.value}px solid #000000`;
      } else {
        frame.style.border = '0px solid #000000';
      }
    }

    toggleInvert.addEventListener('change', () => {
      document.body.classList.toggle('inverted', toggleInvert.checked);
      frame.classList.toggle('inverted', toggleInvert.checked);
    });

    toggleMap.addEventListener('change', () => redrawCanvasAndLines());
    mapOpacity.addEventListener('input', () => redrawCanvasAndLines());

    // Panorering av sporet på canvas
    frame.addEventListener('mousedown', (e) => {
      if (e.target.closest('.label-container') || e.target.closest('#title-container')) return;
      isPanning = true;
      panStartX = e.clientX - offsetX;
      panStartY = e.clientY - offsetY;
      frame.classList.add('grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      offsetX = e.clientX - panStartX;
      offsetY = e.clientY - panStartY;
      updateLabelPositions();
      redrawCanvasAndLines();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      frame.classList.remove('grabbing');
    });

    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const trkpts = xml.querySelectorAll("trkpt");

      trackPoints = [];
      let totalDist = 0;

      trkpts.forEach((pt, index) => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const eleNode = pt.querySelector("ele");
        const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

        if (index > 0) {
          const prev = trackPoints[index - 1];
          totalDist += getDistanceMeters(prev.lat, prev.lon, lat, lon);
        }

        trackPoints.push({ lat, lon, ele, dist: totalDist });
      });

      // Tilbakestill panorering ved ny fil
      offsetX = 0;
      offsetY = 0;

      if (trackPoints.length > 0) {
        statusEl.textContent = "Søker etter topper i kartdata...";
        fetchPeaks();
      } else {
        statusEl.textContent = "Ingen gyldige spor-punkter funnet i GPX.";
      }
    }

    async function fetchPeaks() {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const buffer = 0.08;
      const bMinLat = minLat - buffer;
      const bMaxLat = maxLat + buffer;
      const bMinLon = minLon - buffer;
      const bMaxLon = maxLon + buffer;

      let peaks = [];

      try {
        const url = `https://ws.geonorge.no/stedsnavn/v1/punkt?nordmin=${bMinLat}&nordmaks=${bMaxLat}&ostmin=${bMinLon}&ostmaks=${bMaxLon}&navneobjekttype=Fjell*&maxAntall=100`;
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          peaks = parseKartverketGeonorge(json);
        }
      } catch (err) {
        console.warn("Kartverket API feilet, prøver Overpass fallback...", err);
      }

      if (peaks.length === 0) {
        try {
          const overpassQuery = `[out:json];node["natural"="peak"](${bMinLat},${bMinLon},${bMaxLat},${bMaxLon});out;`;
          const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
          if (res.ok) {
            const json = await res.json();
            peaks = parseOverpass(json);
          }
        } catch (err) {
          console.error("Overpass API feilet:", err);
        }
      }

      statusEl.textContent = `Identifiserte ${peaks.length} potensielle topper. Genererer visning...`;
      render(peaks);
    }

    function parseKartverketGeonorge(data) {
      if (!data || !data.navn) return [];
      const peaks = [];
      data.navn.forEach(item => {
        const name = item.stedsnavn?.[0]?.skrivemåte || item.stedsnavn;
        const lat = item.representasjonspunkt?.nord;
        const lon = item.representasjonspunkt?.øst;
        const height = item.meterOverHavet || item.stedsnavn?.[0]?.meterOverHavet;

        if (name && lat && lon) {
          peaks.push({ name, lat, lon, elevation: height });
        }
      });
      return peaks;
    }

    function parseOverpass(data) {
      if (!data || !data.elements) return [];
      return data.elements.map(el => ({
        name: el.tags?.name || "Ukjent topp",
        lat: el.lat,
        lon: el.lon,
        elevation: el.tags?.ele ? parseInt(el.tags.ele) : null
      }));
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getTransformationParams() {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;

      trackPoints.forEach(p => {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
      });

      const latSpan = maxLat - minLat || 0.005;
      const lonSpan = maxLon - minLon || 0.005;
      const cosLat = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
      const maxSpan = Math.max(latSpan, lonSpan * cosLat);
      const scale = (canvas.width * 0.52) / maxSpan;
      const centerLat = (minLat + maxLat) / 2;
      const centerLon = (minLon + maxLon) / 2;

      return { scale, centerLat, centerLon, cosLat };
    }

    function toCanvasCoords(lat, lon) {
      const { scale, centerLat, centerLon, cosLat } = getTransformationParams();
      return {
        x: canvas.width / 2 + (lon - centerLon) * cosLat * scale + offsetX,
        y: (canvas.height / 2 - 10) - (lat - centerLat) * scale + offsetY
      };
    }

    function render(apiPeaks) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      labelsLayer.innerHTML = '';
      detectedPeaks = [];

      const MARGIN_METER = 2000;
      const addedNames = new Set();

      apiPeaks.forEach(peak => {
        if (addedNames.has(peak.name)) return;

        let closestPt = null;
        let minDistance = Infinity;

        const step = Math.max(1, Math.floor(trackPoints.length / 400));
        for (let i = 0; i < trackPoints.length; i += step) {
          const p = trackPoints[i];
          const dist = getDistanceMeters(p.lat, p.lon, peak.lat, peak.lon);
          if (dist < minDistance) {
            minDistance = dist;
            closestPt = p;
          }
        }

        if (minDistance <= MARGIN_METER && closestPt) {
          addedNames.add(peak.name);
          createPeakAnnotation(peak);
        }
      });

      redrawCanvasAndLines();
    }

    function createPeakAnnotation(peak) {
      const labelContainer = document.createElement('div');
      labelContainer.className = 'label-container';
      
      const heightText = peak.elevation ? ` ${peak.elevation}m` : '';
      const formattedName = `${peak.name.toUpperCase()}${heightText}`;

      labelContainer.innerHTML = `
        <span class="draggable-label">${formattedName}</span>
        <span class="delete-btn" title="Fjern topp">×</span>
      `;

      // Relativt offset fra toppens faktiske posisjon
      let relX = 25;
      let relY = -20;

      labelsLayer.appendChild(labelContainer);

      const peakData = {
        id: Date.now() + Math.random(),
        lat: peak.lat,
        lon: peak.lon,
        relX: relX,
        relY: relY,
        element: labelContainer
      };

      const anchor = toCanvasCoords(peak.lat, peak.lon);
      labelContainer.style.left = `${anchor.x + relX}px`;
      labelContainer.style.top = `${anchor.y + relY}px`;

      const deleteBtn = labelContainer.querySelector('.delete-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        labelContainer.remove();
        detectedPeaks = detectedPeaks.filter(p => p.id !== peakData.id);
        redrawCanvasAndLines();
      });

      detectedPeaks.push(peakData);
      makeDraggable(labelContainer, peakData);
    }

    function updateLabelPositions() {
      detectedPeaks.forEach(p => {
        const anchor = toCanvasCoords(p.lat, p.lon);
        p.element.style.left = `${anchor.x + p.relX}px`;
        p.element.style.top = `${anchor.y + p.relY}px`;
      });
    }

    function makeDraggable(element, data) {
      let isDragging = false;
      let startMouseX = 0;
      let startMouseY = 0;
      let startRelX = 0;
      let startRelY = 0;

      element.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('delete-btn')) return;
        
        isDragging = true;
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        startRelX = data.relX;
        startRelY = data.relY;
        
        e.stopPropagation();
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        data.relX = startRelX + (e.clientX - startMouseX);
        data.relY = startRelY + (e.clientY - startMouseY);

        updateLabelPositions();
        redrawCanvasAndLines();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // CARTO Basemap Fliseberegning
    function lon2tile(lon, zoom) { return (lon + 180) / 360 * Math.pow(2, zoom); }
    function lat2tile(lat, zoom) { return (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom); }

    function drawMapTiles() {
      if (!toggleMap.checked || trackPoints.length === 0) return;

      const { scale, centerLat, centerLon, cosLat } = getTransformationParams();
      const zoom = 12;
      const tileSizePx = 256;

      // Konverter canvas sine 4 hjørner til koordinater for å dekke absolutt heile rammen
      const corners = [
        { x: -offsetX, y: -offsetY },
        { x: canvas.width - offsetX, y: -offsetY },
        { x: -offsetX, y: canvas.height - offsetY },
        { x: canvas.width - offsetX, y: canvas.height - offsetY }
      ];

      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;

      corners.forEach(c => {
        const lon = centerLon + (c.x - canvas.width / 2) / (cosLat * scale);
        const lat = centerLat - (c.y - (canvas.height / 2 - 10)) / scale;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      });

      const minX = Math.floor(lon2tile(minLon, zoom));
      const maxX = Math.floor(lon2tile(maxLon, zoom));
      const minY = Math.floor(lat2tile(maxLat, zoom));
      const maxY = Math.floor(lat2tile(minLat, zoom));

      ctx.globalAlpha = parseFloat(mapOpacity.value);

      for (let x = minX - 1; x <= maxX + 1; x++) {
        for (let y = minY - 1; y <= maxY + 1; y++) {
          const tileKey = `${zoom}/${x}/${y}`;
          
          if (!loadedMapTiles.has(tileKey)) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = `https://basemaps.cartocdn.com/rastertiles/voyager/${zoom}/${x}/${y}.png?key=${CARTO_KEY}`;
            img.onload = () => redrawCanvasAndLines();
            loadedMapTiles.set(tileKey, img);
          }

          const img = loadedMapTiles.get(tileKey);
          if (img && img.complete) {
            const n = Math.pow(2, zoom);
            const tileLon = x / n * 360 - 180;
            const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
            const tileLat = latRad * 180 / Math.PI;

            const pos = toCanvasCoords(tileLat, tileLon);
            const tileSize = (360 / n) * cosLat * scale;

            ctx.drawImage(img, pos.x, pos.y, tileSize + 0.5, tileSize + 0.5);
          }
        }
      }

      ctx.globalAlpha = 1.0;

      // Attribusjon for CARTO
      ctx.font = "8px sans-serif";
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.textAlign = "right";
      ctx.fillText("© CARTO © OpenStreetMap", canvas.width - 10, canvas.height - 10);
    }

    function redrawCanvasAndLines() {
      if (trackPoints.length === 0) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 0. Tegn Kartbakgrunn hvis aktivert
      drawMapTiles();

      // 1. Tegn sporet
      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      trackPoints.forEach((p, index) => {
        const pt = toCanvasCoords(p.lat, p.lon);
        if (index === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 2. Tegn toppmarkeringer og stiplede linjer
      detectedPeaks.forEach(p => {
        const anchor = toCanvasCoords(p.lat, p.lon);
        
        ctx.beginPath();
        ctx.arc(anchor.x, anchor.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        const labelHeight = p.element.offsetHeight || 15;
        const targetX = anchor.x + p.relX;
        const targetY = anchor.y + p.relY + (labelHeight / 2);

        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(anchor.x, anchor.y);
        ctx.lineTo(targetX, anchor.y);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // 3. Tegn Høydeprofil
      drawElevationProfile();

      // 4. Tegn start-koordinat nederst i rammen
      drawStartCoordinates();
    }

    function drawElevationProfile() {
      const profileWidth = canvas.width * 0.55;
      const profileHeight = 45;
      const startX = (canvas.width - profileWidth) / 2;
      const startY = canvas.height - 70;

      let maxEle = -Infinity;
      let minEle = Infinity;
      let maxPt = null;

      trackPoints.forEach(p => {
        if (p.ele > maxEle) {
          maxEle = p.ele;
          maxPt = p;
        }
        if (p.ele < minEle) minEle = p.ele;
      });

      const totalDistance = trackPoints[trackPoints.length - 1].dist;
      if (totalDistance <= 0 || maxEle === minEle) return;

      const eleSpan = maxEle - minEle || 1;

      function getProfileX(dist) {
        return startX + (dist / totalDistance) * profileWidth;
      }

      function getProfileY(ele) {
        return startY + profileHeight - ((ele - minEle) / eleSpan) * profileHeight;
      }

      ctx.beginPath();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;

      trackPoints.forEach((p, index) => {
        const px = getProfileX(p.dist);
        const py = getProfileY(p.ele);
        if (index === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      if (maxPt) {
        const peakX = getProfileX(maxPt.dist);
        const peakY = getProfileY(maxPt.ele);

        ctx.beginPath();
        ctx.arc(peakX, peakY, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#000000";
        ctx.fill();

        const lineTopY = peakY - 12;
        ctx.beginPath();
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(peakX, lineTopY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "bold 9px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#000000";
        ctx.textAlign = "center";
        ctx.fillText(`MAKS ${Math.round(maxEle)}m`, peakX, lineTopY - 3);
      }
    }

    function drawStartCoordinates() {
      if (trackPoints.length === 0) return;

      const start = trackPoints[0];
      const latStr = start.lat.toFixed(5);
      const lonStr = start.lon.toFixed(5);
      const text = `START: ${latStr}° N, ${lonStr}° E`;

      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText(text, canvas.width / 2, canvas.height - 15);
    }

    function downloadImage() {
      if (trackPoints.length === 0) {
        alert("Last opp en GPX-fil først!");
        return;
      }

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      // Hvit bakgrunn som utgangspunkt
      exportCtx.fillStyle = "#ffffff";
      exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      // Tegn over canvas-innholdet
      exportCtx.drawImage(canvas, 0, 0);

      // Render Tittel hvis synlig
      if (titleContainer.style.display !== 'none') {
        const titleText = document.getElementById('title-input').value;
        exportCtx.font = "800 18px -apple-system, BlinkMacSystemFont, sans-serif";
        exportCtx.fillStyle = "#000000";
        exportCtx.textAlign = "center";
        exportCtx.fillText(titleText, canvas.width / 2, 42);
      }

      // Render HTML-etikettene direkte over i bildet
      detectedPeaks.forEach(p => {
        const anchor = toCanvasCoords(p.lat, p.lon);
        const text = p.element.querySelector('.draggable-label').textContent;
        exportCtx.font = "bold 11px -apple-system, BlinkMacSystemFont, sans-serif";
        exportCtx.fillStyle = "#000000";
        exportCtx.textAlign = "left";
        exportCtx.fillText(text, anchor.x + p.relX + 4, anchor.y + p.relY + 12);
      });

      // Render Ramme dersom aktivert
      if (toggleBorder.checked) {
        const bw = parseInt(borderWidth.value);
        exportCtx.strokeStyle = "#000000";
        exportCtx.lineWidth = bw * 2;
        exportCtx.strokeRect(0, 0, exportCanvas.width, exportCanvas.height);
      }

      // Hvis invertert, inverter det ferdige eksporterte bildet
      if (toggleInvert.checked) {
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = canvas.width;
        finalCanvas.height = canvas.height;
        const finalCtx = finalCanvas.getContext('2d');
        
        finalCtx.filter = "invert(1) hue-rotate(180deg)";
        finalCtx.drawImage(exportCanvas, 0, 0);

        const link = document.createElement('a');
        link.download = 'gpx-spor.png';
        link.href = finalCanvas.toDataURL('image/png');
        link.click();
      } else {
        const link = document.createElement('a');
        link.download = 'gpx-spor.png';
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
      }
    }
  </script>
</body>
</html>
